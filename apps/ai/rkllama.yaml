apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rkllama
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rkllama
  template:
    metadata:
      labels:
        app: rkllama
    spec:
      containers:
      - name: rkllama
        image: ghcr.io/notpunchnox/rkllama:main
        ports:
        - containerPort: 8080
        env:
        - name: TARGET_PLATFORM
          value: "rk3588"
        securityContext:
          privileged: true
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: models
          mountPath: /opt/rkllama/models
        resources:
          requests:
            memory: "10Gi"
          limits:
            memory: "13Gi"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: models
        hostPath:
          path: /data/models
---
apiVersion: v1
kind: Service
metadata:
  name: rkllama
  namespace: ai
spec:
  selector:
    app: rkllama
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30081
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rkllama
  namespace: ai
spec:
  rules:
  - host: rkllama.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rkllama
            port:
              number: 80
